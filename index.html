<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사과 뒤집기 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍎 사과 뒤집기 게임</h1>
        <div class="game-info">
            <div class="info-item">
                <span>점수: </span>
                <span id="score">0</span>
            </div>
            <div class="info-item">
                <span>시간: </span>
                <span id="timer">0</span>초
            </div>
            <div class="info-item">
                <span>매칭: </span>
                <span id="matches">0</span>/<span id="totalPairs">0</span>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <button id="startBtn">게임 시작</button>
            <button id="resetBtn">다시 시작</button>
            <button id="leaderboardBtn">리더보드</button>
        </div>
        <div id="gameOver" class="game-over hidden">
            <h2>🎉 게임 완료!</h2>
            <p>총 점수: <span id="finalScore">0</span></p>
            <p>소요 시간: <span id="finalTime">0</span>초</p>
            <div class="save-score">
                <input type="text" id="playerName" placeholder="이름을 입력하세요 (선택사항)" maxlength="20">
                <button id="saveScoreBtn">점수 저장</button>
            </div>
            <p id="saveStatus"></p>
        </div>
        <div id="leaderboard" class="leaderboard hidden">
            <h2>🏆 리더보드</h2>
            <button id="closeLeaderboardBtn">닫기</button>
            <div id="leaderboardList"></div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
